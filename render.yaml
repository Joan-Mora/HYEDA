# Render Free blueprint — HYEDA
# Docs: https://render.com/docs/blueprint-spec
#
# Free plan: solo 1 PostgreSQL activo. Este Blueprint NO crea DB nueva.
# Usa la Postgres Free que ya tienes en el dashboard.
#
# IMPORTANTE — SPRING_DATASOURCE_URL:
# Usa la External Database URL (host tipo dpg-xxx-a.REGION-postgres.render.com),
# NO la Internal (host corto dpg-xxx-a). El host interno falla con
# UnknownHostException si API y DB no están en la misma región / red privada.
# El backend convierte postgres:// → jdbc:postgresql:// y añade sslmode=require.

services:
  - type: web
    name: hyeda-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/auth/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # External Database URL completa (Connect → External)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: HYEDA_JWT_SECRET
        generateValue: true
      - key: HYEDA_ADMIN_USER
        value: admin
      - key: HYEDA_ADMIN_PASS
        sync: false
      # Ej: https://hyeda-web.onrender.com
      - key: HYEDA_CORS_ORIGINS
        sync: false
      - key: HYEDA_STORAGE
        value: /app/storage

  - type: web
    name: hyeda-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # Render pasa envVars como Docker build-args (ARG VITE_API_URL).
    envVars:
      - key: VITE_API_URL
        value: https://hyeda-api.onrender.com/api
