# Render Free blueprint — HYEDA
# Docs: https://render.com/docs/blueprint-spec
#
# Región: Virginia (US East) — latencia razonable para LATAM.
# Si omites region, Render usa oregon por defecto (NO queremos eso).
#
# Free plan: solo 1 PostgreSQL activo. Este Blueprint NO crea DB nueva.
# La Postgres Free existente debe estar también en Virginia; si no,
# Internal DNS falla (UnknownHostException dpg-xxx-a).
#
# SPRING_DATASOURCE_URL:
# Preferir Internal Database URL si API + DB están en Virginia.
# Si aún falla DNS, usa External (host …virginia-postgres.render.com).
# El backend convierte postgres:// → jdbc:postgresql:// y añade sslmode=require en External.

services:
  - type: web
    name: hyeda-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/auth/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Postgres Connect → Internal (misma región) o External
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: HYEDA_JWT_SECRET
        generateValue: true
      - key: HYEDA_ADMIN_USER
        value: admin
      - key: HYEDA_ADMIN_PASS
        sync: false
      # Ej: https://hyeda-web.onrender.com
      - key: HYEDA_CORS_ORIGINS
        sync: false
      - key: HYEDA_STORAGE
        value: /app/storage

  - type: web
    name: hyeda-web
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    # Render pasa envVars como Docker build-args (ARG VITE_API_URL).
    envVars:
      - key: VITE_API_URL
        value: https://hyeda-api.onrender.com/api
