spring.application.name=hyeda
server.port=8081

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

hyeda.jwt.secret=${HYEDA_JWT_SECRET:HyedaSecretKeyForJwtTokensMustBeAtLeast256BitsLong2026!!}
hyeda.jwt.expiration-ms=86400000
hyeda.storage.path=${HYEDA_STORAGE:./storage}
hyeda.assets.path=${HYEDA_ASSETS:../assets}
hyeda.admin.username=${HYEDA_ADMIN_USER:admin}
hyeda.admin.password=${HYEDA_ADMIN_PASS:AdminHyeda2026!}
hyeda.admin.full-name=la propietaria
hyeda.whatsapp.enabled=false
hyeda.whatsapp.token=${WHATSAPP_TOKEN:}
hyeda.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
hyeda.whatsapp.admin-phone=${WHATSAPP_ADMIN_PHONE:0000000000}
hyeda.payments.provider=mock
hyeda.payments.wompi.public-key=${WOMPI_PUBLIC_KEY:}
hyeda.payments.wompi.private-key=${WOMPI_PRIVATE_KEY:}
hyeda.payments.wompi.integrity-key=${WOMPI_INTEGRITY_KEY:}
hyeda.maps.api-key=${GOOGLE_MAPS_API_KEY:}
hyeda.background-check.provider=manual
hyeda.background-check.api-key=${BACKGROUND_CHECK_API_KEY:}
hyeda.stock-reservation-minutes=30
hyeda.daily-report.cron=0 0 20 * * *
